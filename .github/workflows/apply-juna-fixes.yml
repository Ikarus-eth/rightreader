name: Apply Juna launch fixes

on:
  push:
    branches: [fix/juna-first-run]
    paths:
      - tools/apply_juna_fixes.py

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/juna-first-run
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source patch
        run: python tools/apply_juna_fixes.py
      - name: Install build dependencies
        working-directory: src
        run: npm install
      - name: Build production bundle
        working-directory: src
        run: npm run build
      - name: Sanity checks
        run: |
          grep -q 'function localDateKey' src/app-source.jsx
          grep -q 'Save word' src/app-source.jsx
          grep -q 'Reading done' src/app-source.jsx
          grep -q 'rr-v5' sw.js
          test -s app.js
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app-source.jsx app.js config.js sw.js README.md src/package-lock.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Make Right Reader child-first and fix reading accounting'
            git push origin HEAD:fix/juna-first-run
          fi
