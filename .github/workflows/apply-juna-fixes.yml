name: Apply Juna launch fixes

on:
  push:
    branches: [fix/juna-first-run]
    paths:
      - tools/apply_juna_fixes.py
      - tools/run-juna-fixes.txt

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/juna-first-run
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_juna_fixes.py')
          s=p.read_text()
          old='    s2, n = re.subn(pattern, repl, s, count=1, flags=re.S)\n'
          new='    rx = re.compile(pattern, re.S)\n    s2, n = rx.subn(lambda _m: repl, s, count=1)\n'
          if old not in s:
              raise SystemExit('could not patch sub_once helper')
          s=s.replace(old,new,1)
          old2='        raise SystemExit(f"missing replacement target: {old!r}")\n'
          new2='        return\n'
          if old2 not in s:
              raise SystemExit('could not patch optional replacement helper')
          s=s.replace(old2,new2,1)
          marker='# Guard against the specific child-facing German we intended to remove.\n'
          cleanup='''# Final legacy label cleanup before the English-UI guard.\nfor _old,_new in {\n    "Buch hinzufügen":"Add a book", "Meine Wörter":"My words", "Kapitel ":"Chapter ",\n    "Zurück":"Back", "Weiter →":"Next →", "Auf Deutsch":"German", "Neues Wort":"Save word",\n    "Darstellung":"Text", "Schriftgröße":"Text size", "Zeilenabstand":"Line spacing",\n    "Eltern-Bereich":"Parent", "Speichern & testen":"Save & test", "Lesezeit":"Reading",\n    "Noch keine Bücher":"No books yet", "läuft":"running", "pausiert":"paused",\n    "lang drücken = vorlesen":"hold = listen"\n}.items():\n    s=s.replace(_old,_new)\n\n'''
          if marker not in s:
              raise SystemExit('could not find UI guard marker')
          s=s.replace(marker,cleanup+marker,1)
          p.write_text(s)
          PY
          python tools/apply_juna_fixes.py
      - name: Install build dependencies
        working-directory: src
        run: npm install
      - name: Build production bundle
        working-directory: src
        run: npm run build
      - name: Sanity checks
        run: |
          grep -q 'function localDateKey' src/app-source.jsx
          grep -q 'Save word' src/app-source.jsx
          grep -q 'Reading done' src/app-source.jsx
          grep -q 'rr-v5' sw.js
          test -s app.js
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app-source.jsx app.js config.js sw.js README.md src/package-lock.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Make Right Reader child-first and fix reading accounting'
            git push origin HEAD:fix/juna-first-run
          fi
