name: Finalize Right Reader UI

on:
  push:
    branches: [fix/juna-first-run]
    paths:
      - .github/workflows/audit-current.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/juna-first-run
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace last legacy strings
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app-source.jsx')
          s=p.read_text()
          replacements={
            'throw new Error("Zu viele Anfragen \\u2014 kurz warten.");':'throw new Error("Too many requests — wait a moment.");',
            'testing?"Connecting …":"Speichern & testen"':'testing?"Connecting …":"Save & test"',
            'Modelle speichern':'Save models',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing final string: {old}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Build
        working-directory: src
        run: |
          npm install
          npm run build
      - name: Audit
        run: |
          ! grep -nE 'Buch|Bücher|Wörter|Deutsch|Speicher|Eltern|Lese|Heute|Modell|Schlüssel|Verbind|Zurück|Weiter|Inhalt|Schrift|Hintergrund|Papier|Hell|Nacht|Wieder|Laden|konnte|Anfragen|gespeichert|gelöscht|löschen|Vorablesen|Antippen|Datei|Kosten|Sicherung|vorlesen|Erklärung|Bedeutung|gemeinsame|noch|Bitte|Fehler' src/app-source.jsx
          test -s app.js
      - name: Commit final source and bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app-source.jsx app.js
          git commit -m 'Finish English UI cleanup'
          git push origin HEAD:fix/juna-first-run
