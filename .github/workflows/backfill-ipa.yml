name: Build IPA cache backfill

on:
  push:
    branches: [fix/exact-icon-menu-ipa]
    paths:
      - tools/backfill_ipa.py
      - .github/workflows/backfill-ipa.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exact-icon-menu-ipa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply IPA cache backfill
        run: python tools/backfill_ipa.py
      - name: Build production bundle
        working-directory: src
        run: |
          npm install
          npm run build
      - name: Verify
        run: |
          grep -q 'const missingIpa=' src/app-source.jsx
          grep -q 'const haveIpa=' src/app-source.jsx
          grep -q 'rr-v7' sw.js
          test -s app.js
      - name: Commit generated bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app-source.jsx app.js
          git commit -m 'Refresh old cached words to add IPA' || exit 0
          git push origin HEAD:fix/exact-icon-menu-ipa
