name: Build icon backup pronunciation and word-family release

on:
  push:
    branches: [fix/icon-backup-pron]
    paths:
      - tools/fix_icon_backup_pron.py
      - tools/add_remove_word.py
      - icons/icon-source-square.jpg
      - .github/workflows/icon-backup-pron.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/icon-backup-pron
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source patches
        run: |
          python tools/fix_icon_backup_pron.py
          python tools/add_remove_word.py
      - name: Make icons directly from supplied artwork
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat

          art=Image.open('icons/icon-source-square.jpg').convert('RGB')
          if art.width!=art.height:
              raise SystemExit(f'icon source is not square: {art.size}')

          for size,name in [(180,'apple-touch-icon.png'),(192,'icon-192.png'),(512,'icon-512.png'),(512,'icon-maskable-512.png')]:
              art.resize((size,size),Image.Resampling.LANCZOS).save(Path('icons')/name,'PNG',optimize=True)

          # Fail the release if the generated icon is nearly blank again.
          test=Image.open('icons/icon-192.png').convert('RGB')
          stat=ImageStat.Stat(test)
          if max(stat.var)<250:
              raise SystemExit(f'icon variance too low: {stat.var}')
          colours=test.resize((64,64)).getcolors(maxcolors=5000) or []
          if len(colours)<50:
              raise SystemExit(f'icon has too few colours: {len(colours)}')
          print('icon verified', art.size, '->', test.size, 'variance', stat.var, 'colours', len(colours))
          PY
      - name: Build production bundle
        working-directory: src
        run: |
          npm install
          npm run build
      - name: Verify release
        run: |
          grep -q 'MASS-uh-kuh' src/app-source.jsx
          grep -q 'Create full backup' src/app-source.jsx
          grep -q 'function wordFamily' src/app-source.jsx
          grep -q 'Remove underline' src/app-source.jsx
          grep -q 'max(82px' src/app-source.jsx
          grep -q 'rr-v8' sw.js
          grep -q 'apple-touch-icon.png?v=8' index.html
          grep -q 'icon-192.png?v=8' manifest.json
          test -s app.js
          test $(stat -c%s icons/icon-192.png) -gt 10000
          test $(stat -c%s icons/icon-512.png) -gt 30000
      - name: Commit generated release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app-source.jsx app.js README.md sw.js index.html manifest.json icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png
          git commit -m 'Fix icon, preserve data, and improve reading word controls' || exit 0
          git push origin HEAD:fix/icon-backup-pron
