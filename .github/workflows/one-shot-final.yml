name: Final one-shot build

on:
  push:
    branches: [deploy/final-fixes-2]
    paths:
      - tools/run-final-build.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/final-fixes-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final app patches
        run: |
          python tools/fix_icon_backup_pron.py
          python tools/add_remove_word.py
      - name: Build production bundle
        working-directory: src
        run: |
          npm install
          npm run build
      - name: Commit built release
        run: |
          test -s app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app-source.jsx app.js README.md sw.js index.html manifest.json
          git commit -m 'Finalize backup pronunciation word families and reader spacing' || exit 0
          git push origin HEAD:deploy/final-fixes-2
