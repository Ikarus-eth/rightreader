name: Spelling voice (local Kokoro, free)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [spelling/voice-request.json]
permissions:
  contents: write
  pages: write
concurrency:
  group: spelling-audio
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Install Kokoro and Whisper (CPU only)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile faster-whisper
      - name: Record word clips
        run: |
          mode=$(jq -r '.mode // "words"' spelling/voice-request.json)
          if [ "$mode" = "words" ]; then python spelling/tools/local_voice.py; fi
          if [ "$mode" = "fix" ]; then python spelling/tools/fix_words.py; fi
          if [ "$mode" = "new" ]; then python spelling/tools/add_words.py; fi
      - name: Listen to every clip
        if: always()
        run: python spelling/tools/asr_check.py
      - name: Commit
        if: always()
        run: |
          git config user.name "Spelling audio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A spelling/audio
          git diff --cached --quiet && exit 0
          git commit -m "Spelling voice: local Kokoro word clips and listening check"
          git push origin HEAD:main
      - name: Publish the site again
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
