name: Build storybook theme

on:
  push:
    branches: [design/storybook-theme]
    paths:
      - tools/apply_storybook_theme.py
      - icons/icon.svg
      - .github/workflows/storybook-theme.yml

permissions:
  contents: write

jobs:
  build-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/storybook-theme
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply storybook theme
        run: python tools/apply_storybook_theme.py
      - name: Rasterize app icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 512 -h 512 icons/icon.svg -o icons/icon-512.png
          cp icons/icon-512.png icons/icon-maskable-512.png
          rsvg-convert -w 192 -h 192 icons/icon.svg -o icons/icon-192.png
          rsvg-convert -w 180 -h 180 icons/icon.svg -o icons/apple-touch-icon.png
      - name: Build production bundle
        working-directory: src
        run: |
          npm install
          npm run build
      - name: Verify build
        run: |
          grep -q 'brand-title' src/app-source.jsx
          grep -q 'rr-v6' sw.js
          grep -q '#FFF8E3' manifest.json
          test -s app.js
          test -s icons/icon-512.png
          test -s icons/icon-192.png
          test -s icons/apple-touch-icon.png
      - name: Commit generated theme
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app-source.jsx app.js index.html manifest.json sw.js icons/icon.svg icons/icon-512.png icons/icon-maskable-512.png icons/icon-192.png icons/apple-touch-icon.png
          git commit -m 'Adopt warm storybook visual identity' || exit 0
          git push origin HEAD:design/storybook-theme
