<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Spelling Voice</title>
<style>
body{margin:0;padding:20px max(16px,env(safe-area-inset-left));font:18px/1.45 system-ui,-apple-system,sans-serif;background:#eef2fa;color:#1d2742}
main{max-width:620px;margin:0 auto;display:grid;gap:12px}
h1{margin:0;font-size:1.5rem} p{margin:0;color:#5a6786}
.it{background:#fff;border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:2em 1fr auto auto;gap:10px;align-items:center}
.n{font-weight:700;color:#5a6786;text-align:right;font-variant-numeric:tabular-nums}
.w{font-weight:700;font-size:1.25rem;min-width:0}
button{font:inherit;font-size:.95rem;font-weight:700;min-height:44px;padding:6px 14px;border-radius:10px;border:2px solid #c5d1e8;background:#eef2fa;color:#1d2742;cursor:pointer}
.ver{display:block;font-size:.8rem;color:#5a6786;font-weight:400}
</style></head><body><main>
<h1>Check 20 words</h1>
<p id="intro">Play each word and its sentence. Reply in the chat with the numbers that sound wrong or unclear.</p>
<div id="list" style="display:grid;gap:8px"></div>
</main>
<script>
const FALLBACK=["know","important","definitely","immediately","occasionally","individual","community","other","toward","every","tomorrow","eye","of","who","I'd","its","o'clock","queue","rhythm","the boys' room"];
const a=new Audio();
Promise.all([
  fetch("audio/manifest.json",{cache:"no-store"}).then(r=>r.json()),
  fetch("audio/asr-report.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null),
  fetch("audio/fix-report.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)
]).then(([m,rep,fix])=>{
  const info=rep?Object.fromEntries(rep.words.map(x=>[x.word,x])):{};
  const list=fix&&fix.review?fix.review:fix&&fix.changed.length?fix.changed:rep?rep.uncertain:FALLBACK;
  if(fix&&fix.review){document.querySelector("h1").textContent="Check "+fix.review.length+" words";}
  document.getElementById("intro").textContent=fix&&fix.changed.length
    ?"1 to 6 are the words you reported, now re-recorded. 7 to 11 are words the computer still isn't sure about. Reply in the chat with the numbers that sound wrong."
    :rep
    ?"A speech recogniser listened to all 312 clips. These are the 20 it was least sure about. Play each word and its sentence, then reply in the chat with the numbers that sound wrong or unclear."
    :"Play each word and its sentence. Reply in the chat with the numbers that sound wrong or unclear.";
  document.getElementById("list").innerHTML=list.map((w,i)=>{const c=m.words[w];const fresh=c.word.endsWith("-word.mp3");const x=info[w];
    const heard=x?' · computer heard “'+x.heard+'”':'';
    return '<div class="it"><span class="n">'+(i+1)+'.</span><span class="w">'+w+'<span class="ver">'+(fresh?"new":"old")+' recording'+heard+'</span></span><button data-f="'+c.word+'">Word</button><button data-f="'+c.sentence+'">Sentence</button></div>';}).join("");
  document.querySelectorAll("button[data-f]").forEach(b=>b.onclick=()=>{a.src=b.dataset.f;a.play();});
});
</script>
</body></html>
